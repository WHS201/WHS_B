# 배포용 Docker Compose
#
#   cp .env.docker.example .env      # 값 채우기
#   docker compose up -d --build
#
# 구성: db(MySQL) + backend(gunicorn) + scheduler(APScheduler) + frontend(nginx)

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 필요하면 로컬 디버깅용으로만 노출
    # ports:
    #   - "3306:3306"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_COOKIE_SECURE: "true"
      SOCIAL_SIGNUP_TOKEN_SECRET: ${SOCIAL_SIGNUP_TOKEN_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      FSS_API_KEY: ${FSS_API_KEY}
      RUN_DB_UPGRADE: "1"
    # 기본 CMD(gunicorn) 사용

  # 배치 스케줄러: 같은 이미지, command 만 교체.
  # db upgrade 는 backend 가 담당하므로 여기선 끈다.
  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SOCIAL_SIGNUP_TOKEN_SECRET: ${SOCIAL_SIGNUP_TOKEN_SECRET}
      FSS_API_KEY: ${FSS_API_KEY}
      RUN_DB_UPGRADE: "0"
    command: ["python", "run_batch_scheduler.py"]
    # 이 컨테이너엔 HTTP 서버가 없으므로 이미지에 상속된 헬스체크를 끈다.
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_KAKAO_REST_API_KEY: ${VITE_KAKAO_REST_API_KEY}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

volumes:
  db_data:
